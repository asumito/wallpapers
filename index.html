<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Wallpaper Gallery</title>

        <style>
            body {
                margin: 0;
                background: #050505;
                color: #eee;
                font-family: system-ui, sans-serif;
            }

            header {
                text-align: center;
                padding: 20px;
                font-size: 22px;
                font-weight: 600;
            }

            .gallery {
                column-count: 4;
                column-gap: 12px;
                padding: 12px;
            }

            @media (max-width: 900px) {
                .gallery {
                    column-count: 2;
                }
            }

            @media (max-width: 500px) {
                .gallery {
                    column-count: 1;
                }
            }

            .item {
                position: relative;
                margin-bottom: 12px;
                break-inside: avoid;
            }

            .item img {
                width: 100%;
                border-radius: 12px;
                cursor: pointer;
                filter: blur(10px);
                transition:
                    filter 0.4s ease,
                    transform 0.2s ease;
            }

            .item img.loaded {
                filter: blur(0);
            }

            .item img:hover {
                transform: scale(1.02);
            }

            .meta {
                position: absolute;
                bottom: 8px;
                left: 8px;
                font-size: 12px;
                background: rgba(0, 0, 0, 0.6);
                padding: 3px 6px;
                border-radius: 6px;
            }

            .lightbox {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.95);
                display: none;
                align-items: center;
                justify-content: center;
                flex-direction: column;
            }

            .lightbox img {
                max-width: 95%;
                max-height: 85%;
                border-radius: 10px;
            }

            .controls {
                margin-top: 10px;
            }

            button {
                background: #222;
                color: white;
                border: none;
                padding: 10px 14px;
                margin: 4px;
                border-radius: 8px;
                cursor: pointer;
            }

            button:hover {
                background: #333;
            }
        </style>
    </head>

    <body>
        <header>Wallpaper Gallery</header>

        <div class="gallery" id="gallery"></div>

        <div class="lightbox" id="lightbox">
            <img id="viewer" />
            <div class="controls">
                <button id="prev">← Prev</button>
                <button id="download">Download</button>
                <button id="next">Next →</button>
            </div>
        </div>

        <script>

                "8.jpg",
                "9.png",
                "10.jpg",
                "11.png",
                "12.jpg",
                "13.png",
                "14.jpg",
                "15.png",
                "16.jpg",
                "17.png",
                "18.jpg",
                "19.png",
                "20.jpg",

                "23.png",
                "24.jpg",
                "25.jpg",
                "26.jpg",

                "28.jpg",
                "29.jpg",

                "78.png",

                "80.png",

                "120.png",
                "121.png",
                "122.jpg",
                "123.png",
                "124.jpg",
                "125.jpg",
                "126.jpg",
            ];

            files.sort((a, b) =>
                a.localeCompare(b, undefined, { numeric: true }),
            );

            const gallery = document.getElementById("gallery");
            let currentIndex = 0;

            files.forEach((file, i) => {
                const item = document.createElement("div");
                item.className = "item";

                const img = document.createElement("img");
                img.src = "img/" + file;
                img.loading = "lazy";
                img.onload = () => img.classList.add("loaded");

                img.onclick = () => {
                    openViewer(i);
                };

                const meta = document.createElement("div");
                meta.className = "meta";
                meta.textContent = `${i + 1}`;

                item.appendChild(img);
                item.appendChild(meta);
                gallery.appendChild(item);
            });

            const lightbox = document.getElementById("lightbox");
            const viewer = document.getElementById("viewer");

            function openViewer(index) {
                currentIndex = index;
                viewer.src = "img/" + files[index];
                lightbox.style.display = "flex";
            }

            function showNext() {
                currentIndex = (currentIndex + 1) % files.length;
                viewer.src = "img/" + files[currentIndex];
            }

            function showPrev() {
                currentIndex = (currentIndex - 1 + files.length) % files.length;
                viewer.src = "img/" + files[currentIndex];
            }

            document.getElementById("next").onclick = showNext;
            document.getElementById("prev").onclick = showPrev;

            document.getElementById("download").onclick = () => {
                const link = document.createElement("a");
                link.href = viewer.src;
                link.download = "";
                link.click();
            };

            lightbox.onclick = (e) => {
                if (e.target === lightbox) lightbox.style.display = "none";
            };

            document.addEventListener("keydown", (e) => {
                if (lightbox.style.display === "flex") {
                    if (e.key === "ArrowRight") showNext();
                    if (e.key === "ArrowLeft") showPrev();
                    if (e.key === "Escape") lightbox.style.display = "none";
                }
            });
        </script>
    </body>
</html>
